services:
  app:
    build:
      context: .
      target: dev-stage
    container_name: lib-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./storage:/app/storage
    environment:
      - NODE_ENV=development
      - DATABASE_URL=mysql://root:${DATABASE_PASSWORD}@db:3306/${DATABASE_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lib-network
    restart: unless-stopped

  db:
    image: mysql:8
    container_name: lib-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_DATABASE=${DATABASE_NAME}
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - lib-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DATABASE_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  lib-network:
    driver: bridge

volumes:
  db_data:
    driver: local
