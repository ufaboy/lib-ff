services:
  app:
    build:
      context: .
      target: prod-stage
    container_name: lib-app
    ports:
      - "3000:3000"
    volumes:
      - ./storage:/app/storage
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://${DATABASE_NAME}:${DATABASE_PASSWORD}@db:3306/${DB_NAME}
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lib-network
    restart: always

  db:
    image: mysql:8
    container_name: lib-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DATABASE_NAME}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - db_data_prod:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - lib-network
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

networks:
  lib-network:
    driver: bridge

volumes:
  db_data_prod:
    driver: local
